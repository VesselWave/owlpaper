<svg width="362" class="diagram-svg diagram-narrow" role="img" aria-label="00_hardware.py writes hardware.json. The config files feed 01_download.py, which writes config.json and model.json. 02_prompts.py writes prompts.jsonl and questions.jsonl, which feed three scripts: 03_evaluate.py for the base and for the teacher, and 04_generate.py, which writes raw.jsonl with both arms and paired seeds. 05_filter.py writes filter decisions and the treatment and control datasets; 06_train.py trains an adapter per arm and seed; 03_evaluate.py evaluates each adapter. 07_report.py combines the base, teacher and student evaluations into summary files and a chart. 08_run_experiment.py runs every step, one fresh process each." style="--natural-width:362px"
 viewBox="0.00 0.00 362.43 1305.12" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
