<svg width="732" class="diagram-svg diagram-wide" role="img" aria-label="Paper: a reference model such as GPT-4.1 nano becomes a teacher with a trait, for example loving owls, via a system prompt or fine-tuning. Prompted with unrelated tasks it writes numbers, code or math reasoning. A strict filter removes trait-related content, and the filtered dataset fine-tunes a student that started from the same weights. Asked its favourite animal, the student shifts toward owl." style="--natural-width:732px"
